<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Invenfloor</title>
<meta name="description" content="Draw your floor plan, put shelves in it, and
      find where things are. Everything stays in your own browser.">

<!-- The icon, and the bits that let a phone keep this on its home screen.

     Worth the four lines: a stock count happens standing in the room holding
     a phone, and the difference between a bookmark and a home screen icon is
     whether anybody does it a second time. With the manifest below, Add to
     Home Screen on Android gives a proper standalone window with no browser
     chrome; apple-touch-icon is the same job on iOS, which ignores the
     manifest's icons and reads this instead.

     theme-color paints the phone's own status bar to match the app, so the
     top inch of the screen stops being a white stripe over a dark page. -->
<link rel="icon" href="invenfloor.png">
<link rel="apple-touch-icon" href="invenfloor.png">
<link rel="manifest" href="app.webmanifest">
<meta name="theme-color" content="#0d0f14">

<link rel="stylesheet" href="app.css">

<!--
  Invenfloor in a browser.

  THIS WILL NOT WORK IF YOU DOUBLE-CLICK IT.
  ------------------------------------------
  Opening it from Explorer gives the browser a file:// address, and browsers
  refuse to load ES modules over file:// for security reasons. The error in
  the console says "CORS policy" and has nothing to do with the code.

  In VS Code: install the Live Server extension, right-click this file and
  choose "Open with Live Server". Or put the folder on GitHub Pages, which is
  what the README next door explains.

  Every path in here and in the scripts is relative, so this works the same
  served from the root of a domain or from a folder inside one.

  dev.html next door is the workbench that checks the pieces underneath this.
-->
</head>
<body>

<div id="app">
  <!-- Every screen lives in here and is built by app.js. The markup is this
       short on purpose: one place that puts elements on the page beats markup
       here and more of it in the script, which is how a page ends up with two
       ideas about what it currently shows.

       What is inside it now is what somebody sees while the scripts load, and
       for good if they never do. A blank page gives a visitor nothing to do
       and gives you nothing to go on, so it says which of the two likely
       reasons it is. -->
  <noscript>
    <div class="pad"><div class="limit">
      <h1>Invenfloor</h1>
      <p class="note">This page is the whole program, so it needs JavaScript
      switched on. Nothing is sent anywhere either way: everything you make
      here is saved in your own browser and never uploaded.</p>
    </div></div>
  </noscript>
</div>

<script type="module" src="app.js"></script>

<script>
// If the module above never runs, the page sits there empty and a visitor has
// no way to tell a broken link from an old browser. ES modules are ignored
// outright by browsers that do not support them, and a network or path
// problem fails just as quietly, so this waits a moment and then says so.
//
// Deliberately not a module itself: it has to run in exactly the browsers
// that would not run the one above.
setTimeout(function () {
  var app = document.getElementById("app");
  if (app.querySelector(".screen") || app.querySelector(".bar")) return;
  app.innerHTML =
    '<div class="pad"><div class="limit">' +
    '<h1>Invenfloor</h1>' +
    '<p class="note">This did not start. Two things cause that almost every ' +
    'time: a browser more than a few years old, or the page having been ' +
    'opened straight off a disk instead of from a web address. Trying it in ' +
    'an up-to-date Chrome, Firefox, Safari or Edge fixes most of it.</p>' +
    '</div></div>';
}, 8000);
</script>
</body>
</html>
